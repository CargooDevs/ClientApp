<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Post a job</title><link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700&amp;display=swap" rel="stylesheet"><style>body{margin:0;background:#E9ECF1}a{color:#B5470B;text-decoration:none}button,input,textarea{font-family:inherit}</style></head><body><div data-screen="PostJob" data-title="Post a job" style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #FFFFFF; display: flex; flex-direction: column; font-family: Roboto, Arial, sans-serif; color: #12233F; flex-shrink: 0">
<div style="display: flex; align-items: center; gap: 12px; padding: 52px 24px 8px"><a href="Main.dc.html" aria-label="Back" style="width: 44px; height: 44px; border-radius: 22px; background: #F4F6F9; display: flex; align-items: center; justify-content: center; color: #12233F; flex-shrink: 0"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg></a><h1 style="margin: 0; font-size: 18px; font-weight: 600; flex-grow: 1">Post a job</h1></div>
<div style="flex-grow: 1; padding: 20px 24px 0; display: flex; flex-direction: column; gap: 14px; overflow: hidden">
<div style="display: flex; flex-direction: column; gap: 6px"><h2 style="margin: 0; font-size: 24px; line-height: 30px; font-weight: 700; letter-spacing: -0.01em">Tell drivers what you need</h2><p style="margin: 0; font-size: 15px; line-height: 22px; color: #5B6577">Drivers send offers. You choose who moves it.</p></div>
<label style="display: flex; flex-direction: column; gap: 8px; min-width: 0"><span style="font-size: 14px; font-weight: 500">Job title</span><span style="height: 52px; border-radius: 14px; background: #F4F6F9; border: 1.5px solid transparent; display: flex; align-items: center; gap: 12px; padding: 0 16px; box-sizing: border-box"><input value="A small move across town" style="flex-grow: 1; border: 0; background: transparent; font-size: 16px; font-weight: 400; color: #12233F; outline: none; min-width: 0; width: 100%; padding: 0"></span></label>
<div style="background: #F4F6F9; border-radius: 16px; padding: 14px; display: flex; align-items: center; gap: 14px"><div style="display: flex; flex-direction: column; align-items: center; width: 12px; flex-shrink: 0"><div style="width: 10px; height: 10px; border-radius: 5px; background: #12233F"></div><div style="width: 2px; height: 38px; background: #C9D0DA; margin: 4px 0"></div><div style="width: 10px; height: 10px; border-radius: 2px; background: #FF6A1A"></div></div><div style="flex-grow: 1; display: flex; flex-direction: column; gap: 10px; min-width: 0"><div><div style="font-size: 11px; font-weight: 600; letter-spacing: 0.08em; color: #5B6577">FROM</div><div style="font-size: 16px; font-weight: 500; margin-top: 2px">Talatona, Belas</div></div><div style="height: 1px; background: #E6E9EF"></div><div><div style="font-size: 11px; font-weight: 600; letter-spacing: 0.08em; color: #5B6577">TO</div><div style="font-size: 16px; font-weight: 500; margin-top: 2px">Kilamba, Luanda</div></div></div></div>
<div style="display: flex; gap: 12px"><label style="display: flex; flex-direction: column; gap: 8px; flex-grow: 1; flex-basis: 0; min-width: 0"><span style="font-size: 14px; font-weight: 500">Date</span><span style="height: 52px; border-radius: 14px; background: #F4F6F9; border: 1.5px solid transparent; display: flex; align-items: center; gap: 12px; padding: 0 16px; box-sizing: border-box"><span style="color: #5B6577; display: flex"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2zM16 2v4M8 2v4M3 10h18"></path></svg></span><input value="Tomorrow" style="flex-grow: 1; border: 0; background: transparent; font-size: 16px; font-weight: 400; color: #12233F; outline: none; min-width: 0; width: 100%; padding: 0"></span></label><label style="display: flex; flex-direction: column; gap: 8px; flex-grow: 1; flex-basis: 0; min-width: 0"><span style="font-size: 14px; font-weight: 500">Time</span><span style="height: 52px; border-radius: 14px; background: #F4F6F9; border: 1.5px solid transparent; display: flex; align-items: center; gap: 12px; padding: 0 16px; box-sizing: border-box"><span style="color: #5B6577; display: flex"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 12a10 10 0 1 1-20 0 10 10 0 0 1 20 0M12 6v6l4 2"></path></svg></span><input value="09:00" style="flex-grow: 1; border: 0; background: transparent; font-size: 16px; font-weight: 400; color: #12233F; outline: none; min-width: 0; width: 100%; padding: 0"></span></label></div>
<div style="display: flex; flex-direction: column; gap: 8px"><span style="font-size: 14px; font-weight: 500">Vehicle</span><div style="display: flex; gap: 10px"><button type="button" aria-pressed="false" style="flex-grow: 1; flex-basis: 0; height: 44px; border-radius: 12px; border: 1.5px solid #E6E9EF; background: #FFFFFF; color: #12233F; font-size: 15px; font-weight: 500; cursor: pointer">Utility</button><button type="button" aria-pressed="true" style="flex-grow: 1; flex-basis: 0; height: 44px; border-radius: 12px; border: 1.5px solid #FF6A1A; background: #FFF1E8; color: #12233F; font-size: 15px; font-weight: 600; cursor: pointer">Van</button><button type="button" aria-pressed="false" style="flex-grow: 1; flex-basis: 0; height: 44px; border-radius: 12px; border: 1.5px solid #E6E9EF; background: #FFFFFF; color: #12233F; font-size: 15px; font-weight: 500; cursor: pointer">Truck</button></div></div>
<label style="display: flex; flex-direction: column; gap: 8px; min-width: 0"><span style="font-size: 14px; font-weight: 500">Details</span><span style="border-radius: 14px; background: #F4F6F9; border: 1.5px solid transparent; display: flex; padding: 0 16px; box-sizing: border-box"><textarea rows="3"  style="flex-grow: 1; border: 0; background: transparent; font-size: 16px; line-height: 22px; color: #12233F; outline: none; resize: none; padding: 14px 0">Sofa and 6 boxes. 2nd floor, no lift.</textarea></span></label>
</div>
<div style="padding: 12px 24px 32px; display: flex; flex-direction: column; gap: 10px; background: #FFFFFF"><p style="margin: 0; font-size: 13px; line-height: 18px; color: #5B6577; text-align: center">Similar moves usually get offers of 7,500–9,500 Kz.</p><div style="display: flex; gap: 10px"><a href="Offers.dc.html" style="height: 56px; border-radius: 16px; background: #FF6A1A; color: #12233F; font-size: 17px; font-weight: 700; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; box-sizing: border-box; flex-grow: 1">Post job<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#12233F" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18l6-6-6-6"></path></svg></a></div></div>
</div></body></html>
