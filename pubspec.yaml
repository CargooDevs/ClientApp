name: cargoo_client
description: "Cargoo — envie cargas, peça corridas, alugue veículos"
publish_to: 'none'
version: 2.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  cargoo_shared:
    path: ../cargoo_shared
  supabase_flutter: ^2.5.6
  google_maps_flutter: ^2.6.1
  geolocator: ^12.0.0
  intl: ^0.19.0
  flutter_svg: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/client/
