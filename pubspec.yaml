name: cargoo_client
description: "Cargoo — envie cargas, peça corridas, alugue veículos"
publish_to: 'none'
version: 2.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.0.0
  cupertino_icons: ^2.0.0
  cargoo_shared:
    path: ./cargoo_shared
  supabase_flutter: ^2.18.3
  google_maps_flutter: ^2.6.1
  geolocator: ^14.1.2
  intl: ^0.20.2
  flutter_svg: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/client/
